<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VARK Learning Style Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
<style>
/* Thai Wah look: navy + sky cyan, Prompt only, rounded hexagons instead of circles. Single committed light look. */
:root{--navy:#201060;--blue:#1466C7;--cyan:#00B0F0;--sky:#7FD6F7;--wash:#D6EEFB;--paper:#F3F7FC;--ink:#1A1F36;--muted:#5A6478;--line:#DCE3EE;
--V:#1466C7;--A:#00B0F0;--R:#201060;--K:#163F87;--f:"Prompt",Tahoma,sans-serif;color-scheme:light}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}h1,h2{text-wrap:balance;line-height:1.2}
.hero{position:relative;overflow:hidden;background:var(--navy);color:#F5F8FC;border-radius:20px;padding:32px 28px 0;display:flex;flex-direction:column;gap:14px}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(127,214,247,.18) 2.5px,transparent 3px);background-size:26px 26px;pointer-events:none}
.hero>*{position:relative}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.hero h1{font-size:clamp(32px,7vw,52px);font-weight:700}
.hero p.lead{color:var(--wash);font-weight:300;font-size:17px;max-width:52ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px}
.crew{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;align-items:end}
.mate{position:relative;display:flex;flex-direction:column;align-items:center}
.mate .hex{position:absolute;bottom:0;width:92%;aspect-ratio:1}
.mate img{position:relative;height:clamp(110px,24vw,170px);width:auto;max-width:100%;display:block}
.tag{position:absolute;top:0;left:4px;width:38px;height:38px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px;z-index:1}
.tag svg{position:absolute;inset:0}
.tag span{position:relative}
.btn{font:600 17px var(--f);border:0;border-radius:12px;padding:14px 26px;cursor:pointer;background:var(--cyan);color:var(--navy);transition:transform .15s,background .15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--sky)}.btn:active{transform:scale(.98)}
.btn.dark{background:var(--navy);color:#fff}.btn.dark:hover{background:var(--blue)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.start{margin:6px 0 26px;align-self:flex-start}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.how b{color:var(--blue);font-size:13px;letter-spacing:.08em}
.top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:5px;transition:width .35s ease}
.count{font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.qcard{background:#fff;border-radius:20px;border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:18px;box-shadow:0 8px 24px rgba(32,16,96,.06)}
.qcard h2{font-size:clamp(21px,4.4vw,27px);font-weight:600;color:var(--navy)}
.hint{font-size:14px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;text-align:left;padding:18px 18px 18px 56px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:16px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;min-height:84px}
.opt:hover{border-color:var(--sky)}.opt:active{transform:scale(.99)}
.opt .chk{position:absolute;left:16px;top:18px;width:26px;height:26px}
.opt .chk path{fill:none;stroke:var(--line);stroke-width:2.5}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:#EAF7FD}
.opt[aria-pressed="true"] .chk path.h{fill:var(--cyan);stroke:var(--cyan)}
.opt .chk path.t{stroke:#fff;opacity:0}.opt[aria-pressed="true"] .chk path.t{opacity:1}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* result */
#card{background:#fff;border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.rhead{position:relative;background:var(--navy);color:#fff;padding:26px 26px 0;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;overflow:hidden}
.rhead::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(127,214,247,.18) 2.5px,transparent 3px);background-size:26px 26px}
.rhead>*{position:relative;min-width:0}
.rtext{display:flex;flex-direction:column;gap:8px;padding-bottom:24px}
.who{font-size:15px;color:var(--sky)}
.rtitle{font-size:clamp(28px,6vw,42px);font-weight:700;line-height:1.15}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{padding:4px 12px;border-radius:999px;font-weight:600;font-size:14px;background:var(--cyan);color:var(--navy)}
.rart{position:relative;width:clamp(130px,30vw,190px);display:flex;justify-content:center;align-items:flex-end}
.rart .hex{position:absolute;bottom:0;width:100%;aspect-ratio:1}
.rart img{position:relative;height:clamp(150px,34vw,220px);display:block}
.rbody{padding:24px 26px;display:flex;flex-direction:column;gap:20px}
.scores{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:34px 110px 1fr 30px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.sL{width:34px;height:34px;display:grid;place-items:center;font-weight:700;color:#fff;position:relative}
.sL svg{position:absolute;inset:0}.sL span{position:relative}
.strack{height:14px;border-radius:7px;background:var(--paper);overflow:hidden}
.strack i{display:block;height:100%;border-radius:7px}
.sname{font-size:15px;color:var(--muted)}
.styles{display:flex;flex-direction:column;gap:14px}
.sty{border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.styh{display:flex;align-items:center;gap:10px}.styh h3{font-size:19px;color:var(--navy)}.styh h3 span{font-weight:400;color:var(--muted);font-size:15px}
.sty p{font-size:15px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cols>div{min-width:0}.cols b{font-size:14px;color:var(--blue)}
.cols ul{margin:4px 0 0;padding-left:18px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{background:var(--wash);color:var(--navy);border-radius:8px;padding:4px 10px;font-size:14px}
@media (max-width:560px){.cols{grid-template-columns:1fr}}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tip{background:var(--paper);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tip h3{font-size:16px;color:var(--navy)}
.tip ul{margin:0;padding-left:18px;font-size:15px}.tip li{margin:3px 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--muted)}
.foot b{color:var(--navy)}
.namebox{display:flex;flex-direction:column;gap:6px}
.namebox label{font-size:14px;font-weight:500;color:var(--navy)}
.namebox input{font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.toast{font-size:14px;color:var(--blue);min-height:20px}
.more{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.more h3{font-size:17px;color:var(--navy)}
.shot{position:fixed;inset:0;background:rgba(16,12,48,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));z-index:20}
.shot img{max-height:75vh;max-width:100%;border-radius:14px}
.shot p{color:#fff;font-size:15px;text-align:center}
@media (max-width:560px){.opts,.tips,.how{grid-template-columns:1fr}.srow{grid-template-columns:30px 84px 1fr 26px}.qcard,.rbody{padding:20px}.hero{padding:24px 20px 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

   learn:["ฟัง Podcast หรือคลิปเสียงสรุปเนื้อหา","อธิบายเรื่องที่เรียนให้เพื่อนฟัง","ตั้งกลุ่มคุยหรือ Study group"],
   train:["เปิดช่วง Q&A และ Group discussion","ใช้ Storytelling และ Case sharing","ให้สรุปปากเปล่าท้ายแต่ละช่วง"]},
 R:{name:"Read/Write",th:"เรียนรู้ผ่านการอ่านและเขียน",color:"#201060",hexbg:"#D6EEFB",
   detail:"คุณเข้าใจเรื่องต่างๆ ได้ดีที่สุดจากข้อความที่เขียนอย่างเป็นระบบ ชอบมีเอกสารให้อ่านทวนและอ้างอิงได้ และการจดบันทึกช่วยให้คุณจำได้แม่น",traits:['ชอบคู่มือ เอกสาร และรายการเป็นข้อๆ', 'จดโน้ตละเอียดระหว่างเรียนหรือประชุม', 'ชอบให้สรุปเป็นลายลักษณ์อักษร'],formats:['E-learning แบบอ่าน', 'Handbook / SOP', 'Reading List & Article', 'Reflection Journal', 'Quiz และแบบฝึกหัดเขียน'],
   desc:"เข้าใจเร็วจากเอกสาร คู่มือ และการจดบันทึก",
   learn:["อ่านคู่มือหรือ SOP ก่อนลงมือ","จดโน้ตด้วยคำพูดของตัวเอง","สรุปเป็น Checklist ไว้อ่านทวน"],
   train:["แจก Handout และ Reading list","ให้เขียน Reflection หรือ Action plan","ใช้ Quiz และแบบฝึกหัดเขียน"]},
 K:{name:"Kinesthetic",th:"เรียนรู้ผ่านการลงมือทำ",color:"#163F87",hexbg:"#D6EEFB",
   detail:"คุณเข้าใจเรื่องต่างๆ ได้ดีที่สุดเมื่อได้ลงมือทำจริง ทดลอง และเห็นตัวอย่างจากของจริง การนั่งฟังนานๆ จะทำให้เสียสมาธิได้ง่าย",traits:['เรียนรู้จากการลองผิดลองถูก', 'จำได้ดีเมื่อได้ทำซ้ำด้วยตัวเอง', 'ชอบตัวอย่างจริงจากหน้างาน'],formats:['Workshop / Hands-on', 'On-the-job Training', 'Simulation & Role Play', 'Job Shadowing', 'Project-based Learning'],
   desc:"เข้าใจเร็วเมื่อได้ลงมือจริง ทดลอง และเห็นของจริง",
   learn:["ลองทำจริงทันทีหลังเรียน","ใช้ Simulation หรือ Role play","เรียนจาก Case จริงในหน้างาน"],
   train:["ออกแบบ Workshop และ Hands-on","ให้ทดลองใช้ระบบจริงระหว่างเรียน","จับคู่ On-the-job training"]}
};
const Q=[
 {q:"ต้องใช้ระบบ HR ใหม่ที่ไม่เคยใช้ วิธีไหนช่วยให้คุณใช้เป็นเร็วที่สุด",o:{V:"ดูภาพหน้าจอหรือแผนผังขั้นตอน",A:"ให้เพื่อนอธิบาย หรือโทรถามคนที่ใช้เป็น",R:"อ่านคู่มือการใช้งานทีละขั้น",K:"เข้าไปกดลองเองเลย ผิดแล้วค่อยแก้"}},
 {q:"ต้องบอกทางไปร้านอาหารให้เพื่อนที่ไม่เคยไป คุณมักจะ",o:{V:"ส่งแผนที่หรือวาดแผนผังให้ดู",A:"โทรอธิบายเส้นทางทีละจุด",R:"พิมพ์ข้อความบอกทางเป็นข้อๆ",K:"ขับนำไปด้วยกัน หรือนัดจุดที่คุ้นเคย"}},
 {q:"ในการอบรมหนึ่งวัน ช่วงไหนที่คุณได้เรียนรู้มากที่สุด",o:{V:"ตอนวิทยากรใช้แผนภาพหรือ Framework",A:"ตอนถาม-ตอบ และแลกเปลี่ยนในกลุ่ม",R:"ตอนได้อ่านเอกสารและจดบันทึก",K:"ตอน Workshop หรือ Role play"}},
 {q:"จะซื้ออุปกรณ์ไอทีชิ้นใหม่ อะไรช่วยตัดสินใจได้มากที่สุด",o:{V:"ตารางเปรียบเทียบสเปกและภาพสินค้า",A:"คำแนะนำจากพนักงานขายหรือเพื่อน",R:"รีวิวและบทความเปรียบเทียบละเอียด",K:"ไปลองจับและทดลองใช้ที่ร้าน"}},
 {q:"หัวหน้ามอบหมายงานใหม่ที่ซับซ้อน คุณอยากได้ข้อมูลแบบไหน",o:{V:"ภาพรวมเป็นไดอะแกรมหรือ Timeline",A:"คุยต่อหน้าเพื่อซักถามรายละเอียด",R:"อีเมลหรือเอกสาร Brief ที่เขียนชัด",K:"ตัวอย่างงานจริง ให้ลองทำตาม"}},
 {q:"ต้องจำข้อมูลสำคัญ เช่น ขั้นตอนนโยบายใหม่ คุณมักจะ",o:{V:"นึกภาพเป็นลำดับขั้นหรือแผนผัง",A:"ท่องหรือพูดทวนกับตัวเอง",R:"เขียนสรุปเป็นข้อๆ ไว้อ่านทวน",K:"ลองทำตามขั้นตอนจริงสักครั้ง"}},
 {q:"ต้องนำเสนองานต่อผู้บริหาร คุณเตรียมตัวอย่างไร",o:{V:"ออกแบบสไลด์ให้มีกราฟและภาพชัด",A:"ซ้อมพูดออกเสียงหลายรอบ",R:"เขียนสคริปต์และโน้ตละเอียด",K:"ซ้อมในห้องจริงพร้อมจับเวลา"}},
 {q:"อยากทำอาหารเมนูใหม่ คุณเลือกเรียนแบบไหน",o:{V:"ดูคลิปหรือภาพทีละขั้นตอน",A:"ให้คนที่ทำเป็นเล่าวิธีทำให้ฟัง",R:"อ่านสูตรที่เขียนส่วนผสมชัดเจน",K:"ลงมือทำเลย ชิมไปปรับไป"}},
 {q:"เจอปัญหาในงานที่ไม่เคยเจอ คุณเริ่มจาก",o:{V:"วาดแผนผังปัญหาเพื่อดูความเชื่อมโยง",A:"ปรึกษาเพื่อนร่วมงานหรือผู้เชี่ยวชาญ",R:"ค้นข้อมูลและอ่านกรณีศึกษาที่คล้ายกัน",K:"ลองแก้ทีละวิธีแล้วดูผล"}},
 {q:"เวลาว่าง คุณชอบเรียนรู้เรื่องใหม่ผ่านช่องทางไหน",o:{V:"YouTube, Infographic หรือสารคดี",A:"Podcast หรือวงสนทนา",R:"หนังสือ บทความ หรือ Newsletter",K:"Workshop หรือกิจกรรมที่ได้ลงมือทำ"}},
 {q:"หลังอบรม อะไรช่วยให้คุณนำไปใช้ได้จริงมากที่สุด",o:{V:"ภาพสรุปหรือ Framework ที่ติดไว้ดูได้",A:"การคุยติดตามผลกับโค้ชหรือหัวหน้า",R:"เอกสารสรุปและ Checklist อ้างอิง",K:"ได้ทำโปรเจกต์จริงทันทีหลังอบรม"}},
 {q:"ต้องอธิบายเรื่องยากให้น้องในทีมเข้าใจ คุณมักจะ",o:{V:"วาดภาพหรือเขียนแผนผังให้ดู",A:"อธิบายด้วยคำพูดและเล่าตัวอย่าง",R:"ส่งเอกสารหรือเขียนอธิบายเป็นข้อ",K:"ทำให้ดูหนึ่งรอบ แล้วให้ลองทำเอง"}}
];
const ORDER=["V","A","R","K"];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fresh=()=>({step:-1,ans:Q.map(()=>new Set()),order:Q.map(()=>shuffle([...ORDER])),name:""});
let st=fresh();
const app=document.getElementById("app");
const go=s=>{st.step=s;render();window.scrollTo(0,0)};
const tag=k=>`<div class="tag">${hex(S[k].color,"")}<span>${k}</span></div>`;
function render(){st.step<0?intro():st.step>=Q.length?result():question()}

function intro(){
 app.innerHTML=`
 <section class="hero">
  <span class="eyebrow">T&amp;OD · Learning Style Check</span>
  <h1>คุณเรียนรู้แบบไหน?</h1>
  <p class="lead">ค้นหาช่องทางการเรียนรู้ที่ใช่สำหรับคุณ ด้วยกรอบแนวคิด VARK ของ Neil Fleming</p>
  <div class="meta"><span class="pill">12 ข้อ</span><span class="pill">ประมาณ 3 นาที</span><span class="pill">ไม่มีถูกผิด</span></div>
  <button class="btn start" id="start">เริ่มทำแบบประเมิน →</button>
  <div class="crew">${ORDER.map(k=>`<div class="mate">${tag(k)}${hex(S[k].color==="#201060"?"#1466C7":S[k].color)}<img src="${IMG[k]}" alt="${S[k].name}"></div>`).join("")}</div>
 </section>
 <div class="how">
  <div><b>ขั้นที่ 1</b>ตอบตามที่ทำจริง ไม่ใช่ที่คิดว่าควรทำ</div>
  <div><b>ขั้นที่ 2</b>เลือกได้มากกว่า 1 ข้อ ถ้าตรงกับคุณ</div>
  <div><b>ขั้นที่ 3</b>ดูผลทันที และบันทึกเป็นรูปได้</div>
 </div>`;
 document.getElementById("start").onclick=()=>go(0);
}

function question(){
 const i=st.step,it=Q[i],sel=st.ans[i];
 app.innerHTML=`
 <div class="top"><button class="btn ghost" id="back" style="padding:8px 14px;font-size:15px">←</button><div class="bar"><i style="width:${(i+1)/Q.length*100}%"></i></div><span class="count">${i+1} / ${Q.length}</span></div>
 <section class="qcard">
  <h2>${it.q}</h2>
  <p class="hint">เลือกได้มากกว่า 1 ข้อ</p>
  <div class="opts">${st.order[i].map(k=>`<button class="opt" id="q${i}${k}" data-k="${k}" aria-pressed="${sel.has(k)}"><svg class="chk" viewBox="0 0 26 26" aria-hidden="true"><path class="h" d="M10.5,2.5 Q13,1 15.5,2.5 L21.2,5.8 Q23.7,7.3 23.7,10.1 L23.7,15.9 Q23.7,18.7 21.2,20.2 L15.5,23.5 Q13,25 10.5,23.5 L4.8,20.2 Q2.3,18.7 2.3,15.9 L2.3,10.1 Q2.3,7.3 4.8,5.8 Z"/><path class="t" d="M8,13.5 L11.5,17 L18.5,9.5"/></svg>${it.o[k]}</button>`).join("")}</div>
  <div class="nav"><span></span><button class="btn dark" id="next" ${sel.size?"":"disabled"}>${i===Q.length-1?"ดูผลลัพธ์":"ถัดไป →"}</button></div>
 </section>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute("aria-pressed",sel.has(k));document.getElementById("next").disabled=!sel.size});
 document.getElementById("back").onclick=()=>go(i-1);
 document.getElementById("next").onclick=()=>go(i+1);
}

function score(){
 const sc={V:0,A:0,R:0,K:0};st.ans.forEach(s=>s.forEach(k=>sc[k]++));
 const sorted=[...ORDER].sort((a,b)=>sc[b]-sc[a]);const top=sc[sorted[0]];
 const strong=sorted.filter(k=>top-sc[k]<=2&&sc[k]>0);
 return{sc,strong,main:sorted[0]};
}

function result(){
 const {sc,strong,main}=score();const max=Math.max(...ORDER.map(k=>sc[k]),1);
 const multi=strong.length>1;
 const title=multi?(strong.length===4?"Multimodal ครบ 4 แบบ":`Multimodal · ${strong.join("+")}`):`${S[main].name}`;
 const date=new Date().toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
 app.innerHTML=`
 <div id="card">
  <div class="rhead">
   <div class="rtext">
    <span class="who" id="who">${st.name?esc(st.name)+" · ":""}Learning Style ของฉันคือ</span>
    <span class="rtitle">${title}</span>
    <span style="color:var(--wash);font-weight:300">${multi?"เรียนรู้ได้หลายช่องทาง ผสมหลายวิธีจะได้ผลดีที่สุด":S[main].th}</span>
    <div class="badges">${strong.map(k=>`<span class="badge">${k} · ${S[k].name}</span>`).join("")}</div>
   </div>
   <div class="rart">${hex("#1466C7")}<img src="${IMG[main]}" alt="${S[main].name}"></div>
  </div>
  <div class="rbody">
   <div class="scores">${ORDER.map(k=>`<div class="srow"><div class="sL">${hex(S[k].color,"")}<span>${k}</span></div><span class="sname">${S[k].name}</span><div class="strack"><i style="width:${sc[k]/max*100}%;background:${S[k].color}"></i></div><b>${sc[k]}</b></div>`).join("")}</div>
   <div class="styles">${strong.map(k=>`<div class="sty" style="--c:${S[k].color}"><div class="styh"><div class="sL">${hex(S[k].color,"")}<span>${k}</span></div><h3>${S[k].name} <span>${S[k].th}</span></h3></div><p>${S[k].detail}</p><div class="cols"><div><b>ลักษณะเด่น</b><ul>${S[k].traits.map(x=>`<li>${x}</li>`).join("")}</ul></div><div><b>รูปแบบการเรียนรู้ที่เหมาะกับคุณ</b><div class="chips">${S[k].formats.map(x=>`<span class="chip">${x}</span>`).join("")}</div></div></div></div>`).join("")}</div>
   <div class="tips">
    <div class="tip"><h3>เคล็ดลับสำหรับคุณ</h3><ul>${strong.slice(0,2).flatMap(k=>S[k].learn.slice(0,multi?2:3)).map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <div class="tip"><h3>สำหรับหัวหน้า/วิทยากร</h3><ul>${strong.slice(0,2).flatMap(k=>S[k].train.slice(0,multi?2:3)).map(x=>`<li>${x}</li>`).join("")}</ul></div>
   </div>
   <div class="foot"><span><b>Thai Wah</b> · T&amp;OD Learning Style Check</span><span>${date}</span></div>
  </div>
 </div>
 <div class="namebox"><label for="nm">ใส่ชื่อบนการ์ดผลลัพธ์ (ไม่บังคับ)</label><input id="nm" maxlength="40" placeholder="เช่น สมชาย ใจดี" value="${esc(st.name)}"></div>
 <div class="actions"><button class="btn" id="cap">บันทึกผลเป็นรูปภาพ</button><button class="btn ghost" id="again">ทำใหม่อีกครั้ง</button><button class="btn ghost" id="edit">แก้ไขคำตอบ</button></div>
 <p class="toast" id="toast" role="status"></p>
 <div class="more"><h3>ใช้ผลนี้ต่ออย่างไร</h3>
  <p><b>70-20-10:</b> 70% เรียนจากงานจริง 20% จากคนรอบตัว 10% จากการอบรม ใช้สไตล์ของคุณเลือกวิธีในแต่ละส่วน</p>
  <p><b>Kolb's Learning Cycle:</b> ลงมือทำ → สะท้อนคิด → สรุปหลักการ → ทดลองใช้ ทุกสไตล์ควรผ่านครบวงจร</p>
  <p class="hint">ข้อควรรู้: ผลนี้คือความชอบในการรับข้อมูล ไม่ใช่ข้อจำกัด งานวิจัยพบว่าการผสมหลายช่องทาง เช่น ภาพคู่คำอธิบาย ช่วยให้ทุกคนเรียนรู้ได้ดีขึ้น</p>
 </div>`;
 const nm=document.getElementById("nm");
 nm.oninput=()=>{st.name=nm.value.trim();document.getElementById("who").textContent=(st.name?st.name+" · ":"")+"Learning Style ของฉันคือ"};
 document.getElementById("again").onclick=()=>{st=fresh();go(-1)};
 document.getElementById("edit").onclick=()=>go(0);
 document.getElementById("cap").onclick=capture;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{const el=document.getElementById("toast");if(el)el.textContent=t};

async function capture(){
 const btn=document.getElementById("cap");btn.disabled=true;toast("กำลังสร้างรูป...");
 try{
  if(!window.html2canvas)throw new Error("nolib");
  await document.fonts.ready;
  const canvas=await html2canvas(document.getElementById("card"),{scale:2,backgroundColor:"#ffffff",useCORS:true});
  const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
  const fname=`VARK-${(st.name||"result").replace(/[^\w฀-๿-]+/g,"_")}.png`;
  let dl=null;try{dl=await window.claude?.use?.("downloads")}catch(e){}
  if(dl){
   try{await dl.save({filename:fname,data:blob});toast("บันทึกรูปแล้ว");}
   catch(e){if(e&&e.code==="declined")toast("ยกเลิกการบันทึก");else showShot(canvas)}
  }else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();toast("ดาวน์โหลดรูปแล้ว");}
 }catch(e){toast("สร้างรูปไม่สำเร็จ ลองแคปหน้าจอแทนได้เลย")}
 btn.disabled=false;
}
function showShot(canvas){
 toast("");
 const d=document.createElement("div");d.className="shot";
 d.innerHTML=`<img alt="การ์ดผลลัพธ์" src="${canvas.toDataURL("image/png")}"><p>กดค้างที่รูป (มือถือ) หรือคลิกขวา (คอมพิวเตอร์) เพื่อบันทึกรูป</p><button class="btn">ปิด</button>`;
 d.querySelector("button").onclick=()=>d.remove();document.body.appendChild(d);
}
render();
</script>

</body>
</html>
